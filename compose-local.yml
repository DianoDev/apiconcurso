services:
  composer-install:
    container_name: concurso-composer-install
    image: composer:2.8.3
    restart: on-failure
    volumes:
      - '.:/app'
    working_dir: /app
    command: composer update --ignore-platform-req=ext-oci8
    networks:
      - concurso_network

  npm-install:
    container_name: concurso-npm-install
    image: node:20.14.0
    restart: on-failure
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - '.:/var/www/html'
    working_dir: /var/www/html
    command: npm install
    networks:
      - concurso_network

  fpm:
    container_name: concurso-fpm
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile.local
    image: concurso/fpm
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '1000'
      XDEBUG_MODE: 'develop,debug'
      XDEBUG_CONFIG: 'client_host=host.docker.internal'
    volumes:
      - '.:/var/www/html'
    networks:
      - concurso_network
    depends_on:
      composer-install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  nginx:
    container_name: concurso-nginx
    image: concurso/nginx
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT}:80"
    volumes:
      - '.:/var/www/html'
    networks:
      - concurso_network
    depends_on:
      fpm:
        condition: service_started

  mix:
    container_name: concurso-mix
    image: node:20.14.0
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '5173:5173'
    volumes:
      - '.:/var/www/html'
    working_dir: /var/www/html
    command: npm run dev
    networks:
      - concurso_network
    depends_on:
      npm-install:
        condition: service_completed_successfully

  postgres:
    container_name: concurso-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-concurso}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - concurso_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-concurso}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    container_name: concurso-minio
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    networks:
      - concurso_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  concurso_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
